name: Export Day 1 reference documents

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-day1-reference-documents.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download only requested reference documents
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/day1-reference-documents"
          mkdir -p "$OUT"
          BASE="https://raw.githubusercontent.com/Khanii8020/PP-g--Styrene-Co-GMA-Zno/main"
          curl -fL --retry 3 "$BASE/Graft/Experiments/Experiment%201/Day%201/Report.docx" -o "$OUT/Experiment-1-Day-1-Report.docx"
          curl -fL --retry 3 "$BASE/Graft/RAG/PP-g-St-co-GMA%20Suspension/%D8%AF%D8%B3%D8%AA%D9%88%D8%A7%D9%84%D8%B9%D9%85%D9%84%20%D8%A2%D8%B2%D9%85%D8%A7%DB%8C%D8%B4%DA%AF%D8%A7%D9%87%DB%8C-%D8%B3%D9%86%D8%A7%D8%B1%DB%8C%D9%88.docx" -o "$OUT/Lab-Instruction-Scenario.docx"
          curl -fL --retry 3 "$BASE/Graft/RAG/PP-g-St-co-GMA%20Suspension/%D8%AF%D8%B3%D8%AA%D9%88%D8%A7%D9%84%D8%B9%D9%85%D9%84%20%D8%A2%D8%B2%D9%85%D8%A7%DB%8C%D8%B4%DA%AF%D8%A7%D9%87%DB%8C-%D8%B3%D9%86%D8%A7%D8%B1%DB%8C%D9%88.pdf" -o "$OUT/Lab-Instruction-Scenario.pdf"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"

      - name: Upload documents
        uses: actions/upload-artifact@v4
        with:
          name: day1-reference-documents
          path: ${{ runner.temp }}/day1-reference-documents/
          if-no-files-found: error
          retention-days: 1
