name: Export Experiment 1 Day 1 Observations

on:
  push:
    branches:
      - temp/export-exp1-day1-observations-20261101
    paths:
      - ".github/workflows/export-exp1-day1.yml"

permissions:
  contents: read

jobs:
  export-exp1-day1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Experiment 1 Day 1 only
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            Graft/Experiments/Experiment 1/Day 1
          sparse-checkout-cone-mode: false

      - name: Collect source files and create manifest
        shell: bash
        run: |
          set -euo pipefail
          source="Graft/Experiments/Experiment 1/Day 1"
          destination="artifact-exp1-day1"
          mkdir -p "$destination"
          printf 'path\tsize_bytes\tsha256\n' > "$destination/manifest.tsv"
          while IFS= read -r -d '' file; do
            relative="${file#${source}/}"
            target="$destination/$relative"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
            size="$(stat -c '%s' "$file")"
            sha="$(sha256sum "$file" | awk '{print $1}')"
            printf '%s\t%s\t%s\n' "$relative" "$size" "$sha" >> "$destination/manifest.tsv"
          done < <(find "$source" -type f -print0 | sort -z)
          test -s "$destination/manifest.tsv"

      - name: Upload Experiment 1 Day 1 artifact
        uses: actions/upload-artifact@v6
        with:
          name: exp1-day1-observations
          path: artifact-exp1-day1/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
