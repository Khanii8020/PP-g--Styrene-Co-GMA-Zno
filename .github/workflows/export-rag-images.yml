name: Export RAG Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ROOT_PATH: "گرافت/RAG/PP-g-St-co-GMA Suspension"
  FOLDER_START: "1"
  FOLDER_COUNT: "20"
  IMAGE_DIR_NAME: "images"
  ARTIFACT_NAME: "rag-images"
  ARTIFACT_RETENTION_DAYS: "7"

jobs:
  export-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RAG image directories only
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            گرافت/RAG/PP-g-St-co-GMA Suspension/*/images
          sparse-checkout-cone-mode: false

      - name: Compute target folder range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          folder_start="${FOLDER_START}"
          folder_count="${FOLDER_COUNT}"
          folder_end=$((folder_start + folder_count - 1))
          echo "folder_end=${folder_end}" >> "$GITHUB_OUTPUT"

      - name: Collect RAG images and create manifest
        shell: bash
        env:
          FOLDER_END: ${{ steps.range.outputs.folder_end }}
        run: |
          set -euo pipefail
          mkdir -p artifact-images
          printf 'folder\tfilename\tsize_bytes\tstatus\tsource_path\n' > artifact-images/manifest.tsv

          for folder in $(seq "${FOLDER_START}" "${FOLDER_END}"); do
            source="${ROOT_PATH}/${folder}/${IMAGE_DIR_NAME}"
            destination="artifact-images/${folder}"
            mkdir -p "${destination}"

            if [ ! -d "${source}" ]; then
              printf '%s\t\t0\tMissing Image Directory\t%s\n' "${folder}" "${source}" >> artifact-images/manifest.tsv
              continue
            fi

            found=0
            while IFS= read -r -d '' file; do
              found=1
              filename="${file#"${source}"/}"
              size=$(stat -c '%s' "$file")
              printf '%s\t%s\t%s\tOK\t%s\n' "${folder}" "${filename}" "${size}" "${file}" >> artifact-images/manifest.tsv
            done < <(find "${source}" -type f -print0)

            if [ "${found}" -eq 0 ]; then
              printf '%s\t\t0\tEmpty Image Directory\t%s\n' "${folder}" "${source}" >> artifact-images/manifest.tsv
            else
              cp -R "${source}"/. "${destination}/"
            fi
          done

      - name: Upload images artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact-images/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
