name: Export Quench 3-1 Sediment review files

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-quench-3-1-sediment.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only the selected observation folder
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Graft/Experiments/Experiment 1/Day 1/Observations/Quench/3_1- Sediment
          sparse-checkout-cone-mode: true

      - name: Copy selected folder files
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="Graft/Experiments/Experiment 1/Day 1/Observations/Quench/3_1- Sediment"
          OUT="$RUNNER_TEMP/quench-3-1-sediment"
          mkdir -p "$OUT"
          cp "$SOURCE/README.docx" "$OUT/"
          cp "$SOURCE/رسوب 1.jpg" "$OUT/"
          cp "$SOURCE/رسوب 2.jpg" "$OUT/"
          cp "$SOURCE/رسوب 3.jpg" "$OUT/"

      - name: Upload selected folder files
        uses: actions/upload-artifact@v4
        with:
          name: quench-3-1-sediment-review
          path: ${{ runner.temp }}/quench-3-1-sediment/
          if-no-files-found: error
          retention-days: 1
