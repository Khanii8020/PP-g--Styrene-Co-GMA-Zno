name: Export Quench Process observation media

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-quench-process.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pil

      - name: Extract metadata and representative frames
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="Graft/Experiments/Experiment 1/Day 1/Observations/Quench/2- Process"
          OUT="$RUNNER_TEMP/quench-process-export"
          mkdir -p "$OUT/frames"
          cp "$SOURCE/README.docx" "$OUT/"
          cp "$SOURCE/فرایند 5.jpg" "$OUT/"
          : > "$OUT/video-metadata.txt"

          for VIDEO in "$SOURCE"/فرایند\ *.mp4; do
            NAME="$(basename "$VIDEO" .mp4)"
            DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
            SIZE="$(stat -c%s "$VIDEO")"
            printf '%s | duration_seconds=%s | size_bytes=%s\n' "$NAME" "$DURATION" "$SIZE" >> "$OUT/video-metadata.txt"
            mkdir -p "$OUT/frames/$NAME"
            ffmpeg -hide_banner -loglevel error -i "$VIDEO" -vf "fps=1/4,scale=960:-2" -q:v 4 "$OUT/frames/$NAME/frame_%04d.jpg"
          done

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          root = Path("$RUNNER_TEMP")
          export = root / "quench-process-export"
          frame_root = export / "frames"
          interval = 4
          columns = 4
          thumb_width = 360
          thumb_height = 220
          label_height = 28
          per_sheet = 16

          for video_dir in sorted(frame_root.iterdir()):
              frames = sorted(video_dir.glob("*.jpg"))
              if not frames:
                  continue
              for sheet_index in range(0, len(frames), per_sheet):
                  chunk = frames[sheet_index:sheet_index + per_sheet]
                  rows = (len(chunk) + columns - 1) // columns
                  sheet = Image.new("RGB", (columns * thumb_width, rows * (thumb_height + label_height)), "white")
                  draw = ImageDraw.Draw(sheet)
                  for local_index, frame_path in enumerate(chunk):
                      frame_index = int(frame_path.stem.split("_")[-1]) - 1
                      timestamp = frame_index * interval
                      image = Image.open(frame_path).convert("RGB")
                      image.thumbnail((thumb_width, thumb_height))
                      x = (local_index % columns) * thumb_width
                      y = (local_index // columns) * (thumb_height + label_height)
                      sheet.paste(image, (x, y))
                      draw.text((x + 6, y + thumb_height + 5), f"{video_dir.name} | approx. {timestamp}s", fill="black")
                  sheet.save(export / f"{video_dir.name}-sheet-{sheet_index // per_sheet + 1:02d}.jpg", quality=88)
          PY
          rm -rf "$OUT/frames"

      - name: Upload observation export
        uses: actions/upload-artifact@v4
        with:
          name: quench-process-observation-export
          path: ${{ runner.temp }}/quench-process-export/
          if-no-files-found: error
          retention-days: 1
